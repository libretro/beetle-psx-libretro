name: Lightrec threaded compiler

# The threaded recompiler hands blocks to its workers and takes their
# code back without a lock: a slot queue claimed by CAS, a result stack,
# per-worker code arenas grown from a shared chunk pool. The lane runs a
# self-modifying PS-X EXE through the software core under TSan and ASan
# with three workers and a code buffer small enough to overflow every
# few seconds, then through the non-threaded build, and checks the
# program's arithmetic against the host's own.

on:
  push:
    paths:
      - 'deps/lightrec/**'
      - 'deps/lightning/**'
      - 'mednafen/psx/cpu.c'
      - 'mednafen/psx/cpu.h'
      - 'tools/lightrec/**'
      - 'libretro-common/rthreads/**'
      - 'libretro-common/include/retro_atomic.h'
      - 'libretro-common/include/rthreads/**'
      - 'Makefile*'
      - '.github/workflows/lightrec-threaded.yml'
  pull_request:
    paths:
      - 'deps/lightrec/**'
      - 'deps/lightning/**'
      - 'mednafen/psx/cpu.c'
      - 'mednafen/psx/cpu.h'
      - 'tools/lightrec/**'
      - 'libretro-common/rthreads/**'
      - 'libretro-common/include/retro_atomic.h'
      - 'libretro-common/include/rthreads/**'
      - 'Makefile*'
      - '.github/workflows/lightrec-threaded.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightrec-threaded:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3
      - name: Lightrec lane
        run: tools/lightrec/run.sh 300
