name: Memory card writer

# The asynchronous memory card writer hands card snapshots from the
# emulation thread to a writer thread with no lock. The test runs it with
# its real writer thread under ThreadSanitizer and under AddressSanitizer
# with leak detection: order per card, no save lost at stop, saves that
# supersede one another, more cards than slots, and saves made with no
# memory for a snapshot.

on:
  push:
    paths:
      - 'mc_async.c'
      - 'mc_async.h'
      - 'tools/mcasync/**'
      - 'libretro-common/rthreads/**'
      - 'libretro-common/include/retro_atomic.h'
      - 'libretro-common/include/rthreads/**'
      - '.github/workflows/mc-async.yml'
  pull_request:
    paths:
      - 'mc_async.c'
      - 'mc_async.h'
      - 'tools/mcasync/**'
      - 'libretro-common/rthreads/**'
      - 'libretro-common/include/retro_atomic.h'
      - 'libretro-common/include/rthreads/**'
      - '.github/workflows/mc-async.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mc-async:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Memory card writer under TSan and ASan
        run: tools/mcasync/run.sh
