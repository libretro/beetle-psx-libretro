name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x86_64
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          mingw-w64-x86_64-gcc

    - name: Build Core (Software)
      run: |
        make -j$(nproc)
        mv mednafen_psx_libretro.dll mednafen_psx_libretro_sw.dll

    - name: Build Core (Hardware)
      run: |
        make clean
        make -j$(nproc) HAVE_HW=1
        mv mednafen_psx_libretro_sw.dll mednafen_psx_libretro.dll

    - name: Determine Artifact Name
      id: artifact_info
      shell: bash
      run: |
        BRANCH_NAME="${GITHUB_REF_NAME:-branch}"
        COMMIT_HASH="$(git rev-parse --short HEAD)"
        COMMIT_TITLE="$(git log -1 --pretty=%s | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-80)"
        SAFE_BRANCH="$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')"
        ARTIFACT_NAME="windows-x86_64-${SAFE_BRANCH}-${COMMIT_TITLE}-${COMMIT_HASH}"
        echo "Artifact name will be: ${ARTIFACT_NAME}"
        echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact_info.outputs.artifact_name }}
        path: |
          mednafen_psx_libretro.dll
          mednafen_psx_hw_libretro.dll
        if-no-files-found: error

